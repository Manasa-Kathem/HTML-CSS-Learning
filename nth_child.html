<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*selecting rows*/
        tr:nth-child(even)
        {
            background-color:bisque;
            border: 2px solid blueviolet;
        }
        tr:nth-child(odd)
        {
            background-color:brown;
        }
        /*selecting columns*/
        tr td:nth-child(2)
        {
            background-color:aquamarine;
        }
        tr td:nth-child(2):hover
        {
            background-color:orange;
        }
        
    </style>
</head>
<body>
 <table border>
    <th>name</th>
    <th>age</th>
    <th>role</th>
    <tr>
        <td>manasa</td>
        <td>21</td>
        <td>python</td>
    </tr>
    <tr>

        <td>22</td>
        <td>SQL</td>
    </tr>
    <tr>
        <td>arvind</td>
        <td>23</td>

    </tr>
    <tr>

 </table>   
</body>
</html>
