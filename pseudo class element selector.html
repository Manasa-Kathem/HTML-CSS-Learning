<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        pre::first-line
        {
            color:brown;
            font-family:initial;
        }
        pre::first-letter
        {
            color:aquamarine;
            font-size: xx-large;
        }
        pre::before
        {
            content:"$$$$";
        }
        pre::after
        {
            content:"****";
        }
    </style>
</head>
<body>
    <h1>
   <pre>
    html and CSS
    hypertext markup language
    cascading <span style="color: blue;">style</span> sheet
   </pre> 
   </h1>
</body>
</html>
