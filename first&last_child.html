<head>

    <title>Document</title>
    <style>
        #frontend li:first-child{
            color:blue;
            border:5px groove palevioletred;
        }
        #frontend li:last-child{

        }

        }
        #database li:first-child:hover{

            background-color:yellowgreen;
        }
        #database li:last-child{
            color:red;
        }


    </style>
</head>

 <ul id="backend">

</ul>
<ul id="database">

</body>
</html>
