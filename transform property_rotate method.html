<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rotate</title>
    <style>
        p
        {
            background-color: aquamarine;
            border:5px solid red;
            height:250px;
            width:250px;
            margin:20%;
            transform:rotate(90deg) ;
        }
    </style>
</head>
<body>
    <p>rotate</p>
</body>
</html>
